[project]
name = "llm-ad-engine-adk"
version = "0.1.0"
description = "Parallel Google ADK 2.0 implementation for the LLM Ad Engine."
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "httpx>=0.28.1,<1.0.0",
  "mcp>=1.28.1,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
